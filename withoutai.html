<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Research Group</title>
    <link rel="stylesheet" href="withoutai.css">
  </head>
  <body>
    <header>
    <a href="index.html" id="homeBtn">← Home</a>
    <h1>Combine these three objects: a candle, a remote, and glass into a single design.</h1>    
  </header>
  <section id="prompt">
    <p><span id="concept">Think about how they could work together as one new functional or symbolic object.
Present one final idea only.</span></p>
  </section>
   <!-- Object images -->
  <div id="object-images">
    <img src="assets/images/candle.png" alt="Candle">
    <img src="assets/images/remote.png" alt="Remote Control">
    <img src="assets/images/glass.png" alt="Glass">
  </div>
    <canvas id="drawingCanvas" width="800" height="500"></canvas>
    <div id="tool-buttons">
      <button id="penBtn">Pen</button>
      <button id="eraserBtn">Eraser</button>
      <!--- <<button id="clearBtn">Clear</button>> Corey feedback said to get rid of clear button, test with non participants and see if they want it or not then write about it--> 
      <button id="saveBtn">Save Drawing</buttin>
    </div>
    <script src="script.js"></script> <!-- drawing tools / saving form -->

    <form id="saveForm" action="https://formspree.io/f/meorpzpe" method="POST"> <!--- WIthout AI Submission-->
      <input type="hidden" name="drawing" id="drawingInput">
      <input type="hidden" name="keyFeatures" id="keyFeaturesInput">
      <input type="hidden" name="userProfile" id="userProfileInput">
    </form>
  </body>
</html>
