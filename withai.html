<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Research Group</title>
  <link rel="stylesheet" href="withai.css">
</head>
<body>
  <!-- Task -->
  <header>
    <a href="index.html" id="homeBtn">← Home</a>
    <h1>Combine these three objects — a candle, a remote, and glass — into a single design.</h1>    
  </header>
  <section id="prompt">
    <p><span id="concept">Think about how they could work together as one new functional or symbolic object.
Present one final idea only.</span></p>
  </section>
  <!-- Object images -->
  <div id="object-images">
    <img src="assets/candle.png" alt="Candle">
    <img src="assets/remote.png" alt="Remote Control">
    <img src="assets/glass.png" alt="Glass">
  </div>
 <main id="workspace">
  <!-- Canvas section (top) -->
  <section id="drawing-area">
    <canvas id="drawingCanvas" width="800" height="500"></canvas>

    <div id="tool-buttons">
      <button id="penBtn">Pen</button>
      <button id="eraserBtn">Eraser</button>
      <button id="saveBtn">Save Drawing</button>
    </div>
  </section>

  <!-- AI Assistant below the canvas -->
  <section id="ai-section">
    <div class="chatbox">
      <h3>AI Assistant</h3>
      <div id="messages" class="chat-log"></div>
      <div class="chat-input">
        <input id="userInput" type="text" placeholder="Ask AI for ideas..." />
        <button id="sendBtn">Send</button>
      </div>
    </div>
  </section>
</main>

  <!-- Chatbot JS -->
  <script>
    async function sendMessage() {
      const input = document.getElementById("userInput");
      const message = input.value.trim();
      if (!message) return;

      const messagesDiv = document.getElementById("messages");
      messagesDiv.innerHTML += `<div class="message user">${message}</div>`;
      input.value = "";

      try {
        const res = await fetch("https://ux-research-project-ai-backend.onrender.com/chat", {// localhost needs changing to render server 
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message })
        });
        const data = await res.json();

        messagesDiv.innerHTML += `<div class="message ai">${data.reply}</div>`;
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
      } catch (err) {
        messagesDiv.innerHTML += `<div class="message ai">⚠️ Could not reach AI server.</div>`;
      }
    }

    document.getElementById("sendBtn").addEventListener("click", sendMessage);
    document.getElementById("userInput").addEventListener("keypress", (e) => {
      if (e.key === "Enter") sendMessage();
    });
  </script>

  <!-- Drawing tools -->
  <script src="script.js"></script>

  <!-- Submission form -->
  <form id="saveForm" action="https://formspree.io/f/mgvnpzpk" method="POST">
    <input type="hidden" name="drawing" id="drawingInput">
    <input type="hidden" name="keyFeatures" id="keyFeaturesInput">
    <input type="hidden" name="userProfile" id="userProfileInput">
  </form>
</body>
</html>
